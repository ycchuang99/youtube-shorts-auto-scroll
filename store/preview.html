<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>YouTube Shorts Auto Scroll — store preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1280px; height: 800px; background: #f7f7fa; color: #202127; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { height: 100%; padding: 76px; display: flex; align-items: center; gap: 65px; }
  .copy { flex: 1; }
  .brand { display: flex; align-items: center; gap: 15px; font-size: 20px; font-weight: 650; margin-bottom: 52px; }
  .brand img { width: 48px; height: 48px; }
  h1 { font-size: 52px; line-height: 1.16; letter-spacing: -1.8px; margin: 0 0 25px; }
  p { color: #666975; font-size: 23px; line-height: 1.6; margin: 0 0 32px; }
  ul { list-style: none; padding: 0; font-size: 21px; line-height: 2; }
  li::before { content: "✓"; color: #e53451; margin-right: 12px; font-weight: 700; }
  .note { font-size: 16px; color: #797b86; margin-top: 35px; line-height: 1.5; }
  .panel { width: 432px; flex-shrink: 0; padding: 24px 36px 28px; border-radius: 28px; background: #fff; box-shadow: 0 28px 80px #242a4518; }
  .panel-label { color: #767986; font-size: 13px; margin: 0 0 14px; letter-spacing: 1px; }
  iframe { display: block; width: 360px; height: 340px; border: 0; border-radius: 16px; }
</style>
<main>
  <section class="copy">
    <div class="brand"><img src="../assets/images/scroll-icon-128.png" alt="">YouTube Shorts Auto Scroll</div>
    <h1 id="headline"></h1>
    <p id="description"></p>
    <ul id="features"></ul>
    <div class="note" id="note"></div>
  </section>
  <section class="panel">
    <div class="panel-label" id="panel-label"></div>
    <iframe title="Extension popup"></iframe>
  </section>
</main>
<script src="preview.js"></script>
</html>
